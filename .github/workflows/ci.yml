name: Vāk CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Install LLVM and Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm clang
      - name: Install LLVM and Clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm
      - name: Install LLVM and Clang (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install llvm -y --no-progress

      - name: Add LLVM tools to PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Add LLVM tools to PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Format check
        run: cargo fmt -- --check
      - name: Rust tests
        run: cargo test

      - name: Validate generated LLVM and native executables (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vak-ci"
          mkdir -p "$out"
          for sample in native control aggregates for_range strings references; do
            cargo run --quiet -- emit "examples/${sample}.vak" "$out/${sample}.ll"
            llvm-as "$out/${sample}.ll" -o "$out/${sample}.bc"
            clang "$out/${sample}.ll" -o "$out/${sample}"
          done

      - name: Validate generated LLVM and native executables (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'vak-ci'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source
          foreach ($sample in @('native', 'control', 'aggregates', 'for_range', 'strings', 'references')) {
            $ll = Join-Path $out "$sample.ll"
            $bc = Join-Path $out "$sample.bc"
            $exe = Join-Path $out "$sample.exe"
            cargo run --quiet -- emit "examples/$sample.vak" $ll
            # Clang parses LLVM IR directly on Windows; this avoids assuming
            # that the Chocolatey package exposes a separate llvm-as binary.
            & $clang -x ir -c $ll -o $bc
            & $clang $ll -o $exe
            if ($LASTEXITCODE -ne 0) { throw "Native validation failed for $sample" }
          }
